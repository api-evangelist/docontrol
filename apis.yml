aid: docontrol
name: DoControl
description: >-
  DoControl is a SaaS data security platform providing automated data access governance, data loss
  prevention, insider risk management, shadow-app discovery and misconfiguration management across
  connected cloud applications including Google Workspace, Microsoft 365, Salesforce, Slack, Box,
  Dropbox, Zoom, Jira and GitHub. Its public programmable surface is a single Apollo GraphQL
  gateway at apollo-gateway-v4-api.prod.docontrol.io, reached with a five-minute bearer token
  exchanged from a console-issued API key at auth.prod.docontrol.io, and DoControl ships a
  first-party MCP server (dc-mcp-server) that exposes that graph to agents over stdio. Spin.AI
  announced its acquisition of DoControl on 2026-09-01, stating that the DoControl product, site,
  contracts and support are unchanged and that the brands operate independently.

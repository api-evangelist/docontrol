provider: DoControl
providerId: docontrol
description: >-
  Lifecycle posture for the DoControl API surface. DoControl runs a real, public, component-level
  status page and versions its gateway in the hostname, but publishes no deprecation policy, no
  sunset headers, no SLA and no API changelog.
versioning:
  scheme: host-embedded
  current: v4
  evidence: >-
    The GraphQL gateway host is apollo-gateway-v4-api.prod.docontrol.io and the OpenAPI records
    info.version 4.0. The Apollo graph reference DoControl's own MCP server defaults to is
    `docontrol-api@current`, i.e. the floating current variant.
  policy_published: false
  note: >-
    There is no published version-support policy, no list of supported versions, and no statement
    of what happens to v3 or what v5 would mean for a consumer. A schema change lands on
    `@current` with no announced notice period.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  evidence: >-
